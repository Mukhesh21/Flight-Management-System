{% extends 'base.html' %}

{% block title %}Server Error (500) - SkyWings{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
        <h1 class="display-3 fw-bold text-danger brand-font">500</h1>
        <h3 class="fw-bold mb-3">Internal Flight Operations Error</h3>
        <p class="text-muted mb-4" style="max-width: 500px; margin: 0 auto;">
            Our flight dispatch server encountered an unexpected condition. Operations officers have been alerted.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-fms-primary px-4 fw-bold">
            <i class="bi bi-house-door me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
